[book]
authors = ["GreenDelta GmbH", "François Le Rall"]
language = "en"
multilingual = false
src = "src"
title = "openLCA Jython Manual"
theme = "Rust"
description = "The official manual for using Jython scripting in openLCA"

[output.html]
git-repository-url = "https://github.com/GreenDelta/openLCAJython-manual"
edit-url-template = "https://github.com/GreenDelta/openLCAJython-manual/edit/main/{path}"
site-url = "/openLCAJython-manual/"
favicon = "favicon.png"

[output.html.fold]
enable = true    # whether or not to enable section folding
level = 0         # the depth to start folding
